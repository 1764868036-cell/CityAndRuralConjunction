spring.application.name=Hospital Patient Pathway

# Local self-managed Camunda 8 cluster (c8run 8.9.0).
camunda.client.mode=self-managed
camunda.client.grpc-address=http://127.0.0.1:26500
camunda.client.rest-address=http://127.0.0.1:8080

logging.level.io.camunda.client.impl.CamundaCallCredentials=ERROR

# ---------------------------------------------------------------------------
# Simulation of the external parties (referring organisation, patient,
# scheduling service, treatment service, funder, payment provider) and of the
# hospital-side decisions that the model leaves to a human.
#
# Every switch below only changes the content of a job worker result or of a
# published message. Nothing here changes the BPMN model.
# ---------------------------------------------------------------------------

# Publish the correlating "unsolicited" external messages (patient preference,
# patient consent decision, laboratory test results, service restored) on a
# fixed interval, on behalf of the people and systems that cannot be a job
# worker step. On by default, because the demo path should not need anybody to
# publish messages by hand: with the model deployed, a human only has to work
# through the Tasklist tasks. Unmatched messages are buffered by TTL and
# correlate as soon as the process waits for them, so leaving it on is safe.
#
# The interval publications use hospital.simulation.default-referral-id and
# default-patient-id, so demo instances should be started with those ids.
hospital.simulation.auto-responder-enabled=true
hospital.simulation.auto-responder-interval=10s

# Referral / consultation reservations.
hospital.simulation.slot-availability=available
hospital.simulation.patient-decision=accept
hospital.simulation.patient-consent-decision=consent
hospital.simulation.retry-attempts-before-success=1

# External treatment / laboratory / imaging service.
hospital.simulation.treatment-services-available=true

# Insurer / funding organisation.
hospital.simulation.funding-authorised=true

# Payment provider.
hospital.simulation.payment-outcome=paid
hospital.simulation.prior-charge-found=false
hospital.simulation.refund-outcome=completed

# Clinical review of the next treatment cycle.
hospital.simulation.test-results-fit-to-continue=true

# Identifiers used when a simulated external party publishes a message but the
# process has not produced the identifier yet.
hospital.simulation.default-referral-id=REF-1001
hospital.simulation.default-patient-id=PAT-1001
hospital.simulation.default-patient-name=Alex Morgan
hospital.simulation.default-incident-reference=INC-1001

# Optional demo scenario fired once at start-up:
# none | monitoring | identity | interruption | enquiry | refund | follow-up | letter | referral
hospital.simulation.scenario=none

# ---------------------------------------------------------------------------
# System of record: an embedded H2 database in file mode, so the pathway's
# business objects (referrals, appointments, funding, payments, ...) survive a
# restart of the workers. The file lies under java/data/, i.e. below the Java
# project - never inside the bundle folder above it, because that folder is a
# Camunda Modeler process application whose whole tree is deployed and a
# database file there would only get in the way of a deployment.
#
# AUTO_SERVER lets a second process (a SQL client, a second run of the workers)
# attach to the running database, DB_CLOSE_DELAY=-1 keeps it open while the
# connection pool is idle between jobs.
#
# Both scripts are replayed at every start-up. They are written idempotently
# (CREATE TABLE IF NOT EXISTS, MERGE ... KEY), so starting the application twice
# against an existing file database neither fails nor duplicates rows.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/hospital-pathway;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
