# Test classpath root. Spring Boot reads the first application.properties it finds on the classpath,
# and the test classpath carries src/test/resources before src/main/resources - so this file replaces
# the shipped one for every test and has to keep the settings the tests depend on.

# Data source of the tests: an in-memory H2 database. A test run therefore never touches (nor
# creates) the developer's file database under java/data/; the context replays db/schema.sql and
# db/data.sql into the in-memory database exactly as the application does on start-up, so the tests
# exercise the shipped scripts.
spring.datasource.url=jdbc:h2:mem:hospital-pathway;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# No test wants the simulated external parties to publish in the background; the process test
# switches the responder off as well, because it drives the messages by hand.
hospital.simulation.auto-responder-enabled=false

# Client settings of the shipped application.properties, repeated because this file replaces it:
# without them the context would build its client with the defaults instead of pointing it at the
# local c8run cluster that HospitalPathwayProcessTest deploys to.
camunda.client.mode=self-managed
camunda.client.grpc-address=http://127.0.0.1:26500
camunda.client.rest-address=http://127.0.0.1:8080
