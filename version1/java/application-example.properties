# Copy these values into an external Spring configuration file or pass them as
# environment variables. This file is a template and is not loaded automatically.
spring.application.name=Hospital Patient Pathway
camunda.client.mode=self-managed
camunda.client.grpc-address=http://127.0.0.1:26500
camunda.client.rest-address=http://127.0.0.1:8080

# Demonstration only. Turn off automatic simulated responses when connecting
# real external systems; then supply message publishers for those contracts.
hospital.simulation.auto-responder-enabled=true
hospital.simulation.auto-responder-interval=10s
hospital.simulation.default-referral-id=REF-TEST-001
hospital.simulation.default-patient-id=PAT-TEST-001
hospital.simulation.default-patient-name=Test Patient
hospital.simulation.default-incident-reference=INC-TEST-001
hospital.simulation.scenario=none

# Local demonstration database. Use a managed, access-controlled system of
# record for any deployment beyond the synthetic-data assessment environment.
spring.datasource.url=jdbc:h2:file:./data/hospital-pathway;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
