  "definitions" : {
    "Process_HPAS" : "<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"no\"?>\r\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" xmlns:ns0=\"http://camunda.org/schema/modeler/1.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\" exporter=\"Camunda Modeler\" exporterVersion=\"5.46.1\" expressionLanguage=\"http://www.w3.org/1999/XPath\" id=\"Definitions_HPAS\" ns0:executionPlatform=\"Camunda Cloud\" ns0:executionPlatformVersion=\"8.9.0\" targetNamespace=\"http://bpmn.io/schema/bpmn\" typeLanguage=\"http://www.w3.org/2001/XMLSchema\">\r\n    \r\n  <bpmn:message id=\"Msg_Referral\" name=\"HPAS: Referral received\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_Supplementary\" name=\"HPAS: Supplementary information received\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_MissingInfoRequest\" name=\"HPAS: Missing information request\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_ReferralOutcome\" name=\"HPAS: Referral outcome notification\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpm zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_TreatmentChange\" name=\"HPAS: Treatment change requested\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_RefundCase\" name=\"HPAS: Refund case opened\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_TreatmentPlanUpdated\" name=\"HPAS: Treatment plan updated\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_NextCycleDue\" name=\"HPAS: Next cycle due\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_FollowUpInstruction\" name=\"HPAS: Follow-up instruction authorised\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_MonitoringRun\" name=\"HPAS: Monitoring run due\">\r\n        \r\n    <bpmn:extensionElements>\r\n            \r\n      <zeebe:subscription correlationKey=\"= referralId\"/>\r\n          \r\n    </bpmn:extensionElements>\r\n      \r\n  </bpmn:message>\r\n    \r\n  <bpmn:message id=\"Msg_AccessInterruption\" name=\"HPAS: Access or interruption event\">\r\n
