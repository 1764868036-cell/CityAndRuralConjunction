spring.application.name=hpas-redesigned-workers
camunda.client.mode=self-managed
camunda.client.grpc-address=http://127.0.0.1:26500
camunda.client.rest-address=http://127.0.0.1:8080
hpas.simulation.external-responses=true

# Version 2 owns a separate H2 file under its Java project.
spring.datasource.url=jdbc:h2:file:./data/hpas-redesign;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
